version: "3.9"

services:
  football-bot:
    build: .
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PREMIER_LEAGUE_WEBHOOK=${PREMIER_LEAGUE_WEBHOOK}
      - LA_LIGA_WEBHOOK=${LA_LIGA_WEBHOOK}
      - SERIE_A_WEBHOOK=${SERIE_A_WEBHOOK}
      - BUNDESLIGA_WEBHOOK=${BUNDESLIGA_WEBHOOK}
      - LIGUE_1_WEBHOOK=${LIGUE_1_WEBHOOK}
      - OTHER_LEAGUES_WEBHOOK=${OTHER_LEAGUES_WEBHOOK}
      - IMAGO_API_USER=${IMAGO_API_USER}
      - IMAGO_API_KEY=${IMAGO_API_KEY}
      - SONNET_DAILY_CAP_USD=${SONNET_DAILY_CAP_USD:-10.0}
      - DB_PATH=/data/football_ops.db
    volumes:
      - football_data:/data

volumes:
  football_data:
